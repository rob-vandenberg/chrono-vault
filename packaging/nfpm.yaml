# Copyright (C) 2026 Rob Vandenberg
#
# --- Version ------------------------------------------------------------
# nfpm.yaml 0.0.5
#
# --- Version history ----------------------------------------------------
# v0.0.5: ca-certificates, which HTTPS to GitHub needs (D-021)
# v0.0.4: Initial release, modelled on Chrono Viewer's
#
# The .deb and the .rpm of Chrono Vault, made by build-release.sh from the program folder the builder image made
# (D-010). Paths are relative to the project folder. The packaging tool writes only the dependencies listed here:
# what Qt itself needs from a machine, in each system's own names; Qt and OpenSSL ship inside the package.
# The maintainer's contact is the owner's own setting, CHRONO_VAULT_MAINTAINER, read by build-release.sh.
name: chrono-vault
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: utils
priority: optional
maintainer: ${CHRONO_VAULT_MAINTAINER}
description: |
  Chrono Vault: a password manager.
  Keeps your logins, passwords, one-time codes and other secrets in an encrypted vault (Argon2id, AES-256-GCM),
  stored where you choose.
vendor: Rob Vandenberg
homepage: https://github.com/rob-vandenberg/chrono-vault
license: AGPL-3.0-only

contents:
  - src: build-release/chrono-vault
    dst: /opt/chrono-vault
    type: tree
  - src: /opt/chrono-vault/chrono-vault
    dst: /usr/bin/chrono-vault
    type: symlink
  - src: packaging/chrono-vault.desktop
    dst: /usr/share/applications/chrono-vault.desktop
  - src: art/chrono-vault.svg
    dst: /usr/share/icons/hicolor/scalable/apps/chrono-vault.svg
  - src: build-release/chrono-vault/icons/chrono-vault-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/chrono-vault.png
  - src: build-release/chrono-vault/icons/chrono-vault-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/chrono-vault.png
  - src: build-release/chrono-vault/icons/chrono-vault-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/chrono-vault.png
  - src: LICENSE
    dst: /usr/share/doc/chrono-vault/LICENSE
  - src: fonts/OFL.txt
    dst: /usr/share/doc/chrono-vault/OFL.txt

overrides:
  deb:
    depends:
      - ca-certificates
      - libgssapi-krb5-2
      - libglib2.0-0 | libglib2.0-0t64
      - libfontconfig1
      - libfreetype6
      - libdbus-1-3
      - libegl1
      - libopengl0
      - libgl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb-xinput0
      - libxcb-xkb1
      - libxcb-util1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
  rpm:
    depends:
      - ca-certificates
      - libgssapi_krb5.so.2()(64bit)
      - libglib-2.0.so.0()(64bit)
      - libgthread-2.0.so.0()(64bit)
      - libfontconfig.so.1()(64bit)
      - libfreetype.so.6()(64bit)
      - libdbus-1.so.3()(64bit)
      - libEGL.so.1()(64bit)
      - libOpenGL.so.0()(64bit)
      - libGL.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libxcb-cursor.so.0()(64bit)
      - libxcb-icccm.so.4()(64bit)
      - libxcb-image.so.0()(64bit)
      - libxcb-keysyms.so.1()(64bit)
      - libxcb-randr.so.0()(64bit)
      - libxcb-render.so.0()(64bit)
      - libxcb-render-util.so.0()(64bit)
      - libxcb-shape.so.0()(64bit)
      - libxcb-shm.so.0()(64bit)
      - libxcb-sync.so.1()(64bit)
      - libxcb-xfixes.so.0()(64bit)
      - libxcb-xinput.so.0()(64bit)
      - libxcb-xkb.so.1()(64bit)
      - libxcb-util.so.1()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
